# 홈서버 데모 배포용 — MySQL + 앱(백엔드+프론트 통합 이미지) 2개 컨테이너.
# 로컬 개발용 backend/docker-compose.yml(MySQL만)과는 별개.
#
# 실행: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# (.env.prod는 .env.prod.example을 복사해서 실제 값 채운 파일 — .gitignore(.env.*)로 커밋 제외됨)
services:
  mysql:
    image: mysql:8.0
    container_name: mlsoft-leave-mysql-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?.env.prod에 DB_PASSWORD를 설정하세요}
      MYSQL_DATABASE: mlsoft_leave
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-prod-data:/var/lib/mysql
      # 최초 스키마 (리뷰 O-2) — 앱이 ddl-auto: validate 라 테이블을 만들지 않는다.
      # MySQL은 데이터 볼륨이 비어 있을 때만 이 디렉터리를 실행하므로 재기동해도 덮어쓰지 않는다.
      # 엔티티를 바꾸면 db/schema.sql 도 함께 갱신할 것 (안 하면 앱이 기동을 거부한다).
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${DB_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlsoft-leave-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      # 컨테이너 네트워크 내부 접속 정보 — .env.prod가 아니라 여기서 고정
      # (mysql은 localhost가 아니라 서비스명으로 접속)
      DB_URL: jdbc:mysql://mysql:3306/mlsoft_leave?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: root
      SPRING_PROFILES_ACTIVE: prod
      # mysql 서비스에만 있고 앱에는 빠져 있었다 (리뷰 I-7).
      # 도메인 로직은 LocalDate.now(KST)로 시간대를 고정하므로 이것 없이도 연차 계산은 맞지만,
      # 로그 타임스탬프와 Bean Validation의 날짜 애노테이션은 JVM 기본값(UTC)을 따라
      # KST 00~09시 사이에 하루 어긋난 채로 찍히고 판정됐다.
      TZ: Asia/Seoul
    ports:
      - '8080:8080'

volumes:
  mysql-prod-data:
