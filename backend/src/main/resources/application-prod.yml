# 운영 프로필 (리뷰 O-2) — docker-compose.prod.yml 이 SPRING_PROFILES_ACTIVE=prod 로 활성화한다.
#
# 이 파일이 없던 동안 base(application.yml)의 ddl-auto: update 가 그대로 상속돼,
# 홈서버 배포본이 운영 DB에 Hibernate 자동 ALTER를 거는 상태였다 (docs/08 Y-6 위반).
# 프로필 파일이 없어도 Spring은 에러를 내지 않고 조용히 넘어가므로 눈치채기 어렵다.
#
# 시크릿은 여기 적지 않는다 — 전부 .env.prod 의 환경변수로 주입된다 (base가 ${...}로 참조).
spring:
  jpa:
    hibernate:
      # 운영은 스키마를 절대 자동 변경하지 않는다. 엔티티와 실제 스키마가 어긋나면 기동을 거부한다.
      # 최초 스키마는 db/schema.sql 이 만든다 (mysql 컨테이너의 initdb.d 로 마운트).
      # 엔티티를 바꾸고 schema.sql 갱신을 잊으면 여기서 배포가 멈춘다 — 의도된 동작이다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # 운영 로그에 SQL 원문을 남기지 않는다 (사유·이름 등이 파라미터로 흐른다)
        format_sql: false

  # 기동 시 initdb.d 실행이 끝나기 전 커넥션을 잡으면 validate가 테이블 없음으로 실패할 수 있다.
  # compose의 healthcheck(depends_on: service_healthy)가 1차 방어이고, 여기서 한 번 더 여유를 준다.
  datasource:
    hikari:
      initialization-fail-timeout: 30000

logging:
  level:
    # base의 debug를 운영에서 끈다 — 요청 파라미터·엔티티 값이 그대로 찍힌다
    com.mlsoft.backend: info
    org.hibernate.SQL: warn
