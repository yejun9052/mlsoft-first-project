# 테스트 전용 설정 — H2 인메모리 (MySQL 호환 모드)
# NON_KEYWORDS: MySQL에서는 비예약어지만 H2에서 예약어인 컬럼명(year/day/value) 허용
spring:
  datasource:
    url: jdbc:h2:mem:mlsoft_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=YEAR,DAY,VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  # 이 파일은 메인 application.yml을 **덮어쓴다**(같은 이름이라 테스트 클래스패스 것만 로드된다).
  # 그래서 host를 여기 다시 써야 한다 — MailSenderAutoConfiguration이
  # @ConditionalOnProperty("spring.mail.host")라, 빠뜨리면 JavaMailSender 빈이 없어
  # EmailDeliveryService 생성이 실패하고 @SpringBootTest 컨텍스트가 전부 죽는다.
  #
  # 실제 접속은 일어나지 않는다: username이 비어 있으면 EmailDeliveryService가
  # send() 앞에서 FAILED로 끊는다. 그래서 localhost로 둬도 테스트가 네트워크를 타지 않는다.
  mail:
    host: localhost
    port: 3025
    username:
    password:

  # OAuth2 클라이언트 더미 — 컨텍스트 로드용 (실제 인증 안 함)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - profile
              - email

jwt:
  secret: test-only-secret-key-for-context-load-0123456789
  expiration-ms: 86400000

holiday:
  api-key: test-holiday-api-key

app:
  allowed-domain: mlsoft.com
  admin-emails: admin@mlsoft.com
  frontend-url: http://localhost:5173
  cookie-secure: false
  mail:
    reply-to:
